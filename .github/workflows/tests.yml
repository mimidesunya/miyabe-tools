name: tests

# pytest・php -l・PHP のテスト・MCP の型検査を dev/run_tests.py でまとめて走らせる。
# 版は本番に揃える（取得イメージは Ubuntu 22.04 の Python 3.10、php:8.3-fpm、node:22）。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: dev/requirements-test.txt

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: mbstring, curl, dom, xml, sqlite3, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docker/mcp/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r dev/requirements-test.txt
          npm ci --prefix docker/mcp

      - name: Run tests
        run: python dev/run_tests.py
