openapi: 3.1.0
info:
  title: 自治体マップ 検索API
  version: 1.0.0
  description: 全国自治体の会議録・例規集・事務事業評価を検索する公開APIです。既定では会議録を検索します。AIアシスタント連携にはMCPエンドポイント https://tools.miya.be/mcp を推奨します。このREST APIは互換のため維持されます。
servers:
  - url: https://tools.miya.be
    description: Production
paths:
  /api/search:
    get:
      operationId: searchMunicipalDocuments
      summary: 会議録・例規集・事務事業評価を検索する
      description: 検索語、文書種別、都道府県、自治体で絞り込み、抜粋と原典URLを返します。hyoka は年度・種別、それ以外は日付範囲で絞れます。hyoka の1件は頁単位（頁区切りが不明なら文書全体）です。
      parameters:
        - name: q
          in: query
          required: false
          description: 検索語。空白区切りはAND検索、引用符で完全一致、OR/NOT/括弧も利用できます（全角でも同じ）。OR は左右の語のまとまりを分けるので、範囲は括弧で示してください。200字まで。slug か municipality_code で自治体を1つに絞るときは省けます（新しい順の一覧になります）。
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: 盛土 メガソーラー
        - name: doc_type
          in: query
          required: false
          description: 検索対象。minutes は会議録、reiki は例規集、hyoka は事務事業評価。省略時は会議録です。
          schema:
            type: string
            enum: [minutes, reiki, hyoka]
            default: minutes
        - name: pref_code
          in: query
          required: false
          description: 都道府県コード。神奈川県は14です。
          schema:
            type: string
            pattern: "^\\d{1,2}$"
          example: "14"
        - name: slug
          in: query
          required: false
          description: 自治体を1つに絞るID。検索結果や検索画面のURLに含まれます。
          schema:
            type: string
          example: 14216-zama-shi
        - name: municipality_code
          in: query
          required: false
          description: 全国地方公共団体コード（検査数字なしの5桁。座間市なら 14216）で絞り込みます。検査数字つきの6桁も受け付けます。
          schema:
            type: string
            pattern: "^\\d{5,6}$"
          example: "14216"
        - name: start_date
          in: query
          required: false
          description: 検索対象期間の開始日。YYYY-MM-DD形式です。会議録は開催日、例規集は公布日で絞ります。hyoka には適用されません。
          schema:
            type: string
            format: date
          example: "2020-01-01"
        - name: end_date
          in: query
          required: false
          description: 検索対象期間の終了日。YYYY-MM-DD形式です。会議録は開催日、例規集は公布日で絞ります。hyoka には適用されません。
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: start_year
          in: query
          required: false
          description: 検索対象期間の開始年。start_date が未指定の場合に使われます。hyoka には適用されません。
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 2020
        - name: end_year
          in: query
          required: false
          description: 検索対象期間の終了年。end_date が未指定の場合に使われます。hyoka には適用されません。
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 2024
        - name: fiscal_year
          in: query
          required: false
          description: hyoka の年度を西暦4桁で完全一致指定します。minutes/reiki では使いません。
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2024
        - name: kind
          in: query
          required: false
          description: hyoka の種別。事務事業評価、施策・政策評価、外部評価、概要・一覧。minutes/reiki では使いません。
          schema:
            type: string
            enum: [project_evaluation, policy_evaluation, external_review, overview]
        - name: sort
          in: query
          required: false
          description: 並び順。dateは新しい順（会議録は開催日、例規集は公布日、hyoka は年度）、relevanceは関連度順です。
          schema:
            type: string
            enum: [date, relevance]
            default: date
        - name: page
          in: query
          required: false
          description: ページ番号。先頭から10,000件目までしか取れません（page × per_page が 10000 以下）。超えると 422 です。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: 1ページあたりの件数。最大100件です。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: include_facets
          in: query
          required: false
          description: trueの場合、文書種別・都道府県・自治体ごとの件数（aggregations）も返します。
          schema:
            type: boolean
            default: false
        - name: include_body_highlight
          in: query
          required: false
          description: falseの場合、本文中の該当箇所を探しません。excerpt には件名・会議名に当たった箇所だけが入り、無ければ空です。応答は速くなります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: 検索語が未指定（自治体を1つに絞っていない）、または検索条件が不正です。不正な doc_type・sort・日付・年・pref_code・municipality_code、見つからない slug、200字を超える検索語、10,000件目より先のページ、hyoka の fiscal_year / kind の不正値を含みます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 検索処理に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/document:
    get:
      operationId: getMunicipalDocument
      summary: 文書の全文を取得する
      description: 検索結果のidとdoc_typeを指定して本文を返します。hyoka は該当頁の本文（頁区切りが不明なら文書全体）と原典URL・頁を返します。
      parameters:
        - name: id
          in: query
          required: true
          description: /api/search の items[].id で返る文書IDです。
          schema:
            type: string
            minLength: 1
        - name: doc_type
          in: query
          required: false
          description: 文書種別。minutes は会議録、reiki は例規集、hyoka は事務事業評価。省略時は会議録です。
          schema:
            type: string
            enum: [minutes, reiki, hyoka]
            default: minutes
      responses:
        "200":
          description: 文書全文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: 文書が見つかりません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 文書IDが未指定です。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 文書取得に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/hyoka-projects.php:
    get:
      operationId: searchHyokaProjects
      summary: 事務事業評価の事業を条件で探す
      description: 事業ごとの欄に分けてある事務事業評価の事業を、語・費用・前年度からの増減・方向性・評価・成果指標の目標割れで絞り、関連度・費用・増え方などの順に返します。金額は円にそろえた値と原典の値の両方を返します。値は原典の表の欄を機械やAIが書き写したもので、人の確認はまだです。
      parameters:
        - $ref: "#/components/parameters/ProjectQ"
        - $ref: "#/components/parameters/ProjectPrefCode"
        - $ref: "#/components/parameters/ProjectSlug"
        - $ref: "#/components/parameters/ProjectMunicipalityCode"
        - $ref: "#/components/parameters/ProjectEvaluationYear"
        - $ref: "#/components/parameters/ProjectDepartment"
        - $ref: "#/components/parameters/ProjectPolicy"
        - $ref: "#/components/parameters/ProjectDirection"
        - $ref: "#/components/parameters/ProjectRating"
        - $ref: "#/components/parameters/ProjectAspect"
        - $ref: "#/components/parameters/ProjectAchievement"
        - $ref: "#/components/parameters/ProjectOverall"
        - $ref: "#/components/parameters/ProjectMethod"
        - $ref: "#/components/parameters/ProjectFlag"
        - $ref: "#/components/parameters/ProjectHasAmounts"
        - $ref: "#/components/parameters/ProjectIsMain"
        - $ref: "#/components/parameters/ProjectMinCost"
        - $ref: "#/components/parameters/ProjectMaxCost"
        - $ref: "#/components/parameters/ProjectBelowTarget"
        - $ref: "#/components/parameters/ProjectMaxOutcomeRatio"
        - $ref: "#/components/parameters/ProjectMinCostChangeRatio"
        - $ref: "#/components/parameters/ProjectMaxOutcomeBestRatio"
        - $ref: "#/components/parameters/ProjectMaxActualChangeRatio"
        - $ref: "#/components/parameters/ProjectMinPersonnelRatio"
        - $ref: "#/components/parameters/ProjectMinCostPerPerson"
        - name: sort
          in: query
          required: false
          description: relevance 関連度、cost_desc 費用の大きい順、cost_asc 小さい順、cost_change_desc 前年度からの増え方の大きい順、outcome_ratio 成果指標の達成の低い順、year_desc 新しい評価から、personnel_ratio_desc 費用に占める人件費の割合の高い順、cost_per_person_desc 1人あたりの費用の高い順。既定は q があれば relevance、無ければ cost_desc。
          schema:
            type: string
            enum: [relevance, cost_desc, cost_asc, cost_change_desc, outcome_ratio, year_desc, personnel_ratio_desc, cost_per_person_desc]
        - name: page
          in: query
          required: false
          description: 結果のページ番号。page × per_page は10000まで。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: 1ページの件数。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 事業の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HyokaProjectsResponse"
        "422":
          description: 条件が正しくありません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/hyoka-aggregate.php:
    get:
      operationId: aggregateHyokaAmounts
      summary: 事務事業評価の事業の金額を集計する
      description: /api/hyoka-projects.php と同じ条件で事業を絞り、年度・費目・段階を選んで、合計と内訳（自治体・都道府県・担当部署・方向性・年度）、金額の大きい事業を返します。同じ事業・年度・費目の金額は1つだけ数えます。合計は評価に載った事業だけのもので、自治体の予算・決算の総額ではありません。
      parameters:
        - $ref: "#/components/parameters/ProjectQ"
        - $ref: "#/components/parameters/ProjectPrefCode"
        - $ref: "#/components/parameters/ProjectSlug"
        - $ref: "#/components/parameters/ProjectMunicipalityCode"
        - $ref: "#/components/parameters/ProjectEvaluationYear"
        - $ref: "#/components/parameters/ProjectDepartment"
        - $ref: "#/components/parameters/ProjectPolicy"
        - $ref: "#/components/parameters/ProjectDirection"
        - $ref: "#/components/parameters/ProjectRating"
        - $ref: "#/components/parameters/ProjectAspect"
        - $ref: "#/components/parameters/ProjectAchievement"
        - $ref: "#/components/parameters/ProjectOverall"
        - $ref: "#/components/parameters/ProjectMethod"
        - $ref: "#/components/parameters/ProjectFlag"
        - $ref: "#/components/parameters/ProjectHasAmounts"
        - $ref: "#/components/parameters/ProjectIsMain"
        - $ref: "#/components/parameters/ProjectMinCost"
        - $ref: "#/components/parameters/ProjectMaxCost"
        - $ref: "#/components/parameters/ProjectBelowTarget"
        - $ref: "#/components/parameters/ProjectMaxOutcomeRatio"
        - $ref: "#/components/parameters/ProjectMinCostChangeRatio"
        - $ref: "#/components/parameters/ProjectMaxOutcomeBestRatio"
        - $ref: "#/components/parameters/ProjectMaxActualChangeRatio"
        - $ref: "#/components/parameters/ProjectMinPersonnelRatio"
        - $ref: "#/components/parameters/ProjectMinCostPerPerson"
        - name: year
          in: query
          required: false
          description: 金額の年度（西暦）。group_by が year 以外では必須です。
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2024
        - name: from_year
          in: query
          required: false
          description: group_by=year のときの最初の年度。
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: to_year
          in: query
          required: false
          description: group_by=year のときの最後の年度。
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: scope
          in: query
          required: false
          description: 足す費目。total 総費用（人件費を含む）、direct 事業費、personnel 人件費、funding_* は財源の内訳です。
          schema:
            type: string
            enum: [total, direct, personnel, sub_project, breakdown, other, funding_national, funding_prefecture, funding_bond, funding_fund, funding_user_fee, funding_other_specific, funding_general, funding_other]
            default: total
        - name: stage
          in: query
          required: false
          description: best は事業ごとに決算・決算見込・予算・計画の順で1つ。settlement 決算、estimate 決算見込、revised_budget 補正後予算、budget 予算（当初か補正後か分からないもの）、initial_budget 当初予算、plan 計画は、その段階だけを足します。
          schema:
            type: string
            enum: [best, settlement, estimate, revised_budget, budget, initial_budget, plan]
            default: best
        - name: group_by
          in: query
          required: false
          description: 内訳の分け方。policy_top は体系の道筋のいちばん上の段（政策など）、policy_leaf はいちばん下の段（施策など）、variant は区や対象で分けた事業をもとの事業名でまとめます。体系や分けの分からない事業は other_groups_yen に入ります。
          schema:
            type: string
            enum: [none, municipality, prefecture, department, direction, year, policy_top, policy_leaf, variant]
            default: none
        - name: limit
          in: query
          required: false
          description: 内訳の数（金額の大きい順、year は古い順）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: top
          in: query
          required: false
          description: 金額の大きい事業を何件添えるか。
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 5
      responses:
        "200":
          description: 集計結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HyokaAggregateResponse"
        "422":
          description: 条件が正しくありません（年度の指定が無いなど）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/hyoka-project.php:
    get:
      operationId: getHyokaProject
      summary: 事務事業評価の事業1件の全部を取得する
      description: 事業の id から、円にそろえた金額の明細、原典の欄と表（原典の単位のまま）、指標、評価の段階、検算の結果、その事業の頁の表を文字にしたものを返します。
      parameters:
        - name: id
          in: query
          required: true
          description: /api/hyoka-projects.php の items[].id（hyoka-project:…）。
          schema:
            type: string
            minLength: 1
        - name: include_sheet
          in: query
          required: false
          description: 0 なら頁の表の文字を返しません。
          schema:
            type: boolean
            default: true
        - name: max_sheet_chars
          in: query
          required: false
          description: 頁の表の文字の上限。
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 20000
      responses:
        "200":
          description: 事業1件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HyokaProjectResponse"
        "404":
          description: 事業が見つかりません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: id の形が正しくありません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ProjectQ:
      name: q
      in: query
      required: false
      description: 検索語（事業名・担当・目的・欄の文字）。空白区切りはAND、OR/NOT/括弧も使えます。省くと条件だけで絞ります。
      schema:
        type: string
        maxLength: 200
    ProjectPrefCode:
      name: pref_code
      in: query
      required: false
      description: 都道府県コード。
      schema:
        type: string
        pattern: "^\\d{1,2}$"
    ProjectSlug:
      name: slug
      in: query
      required: false
      description: 自治体を1つに絞るID。
      schema:
        type: string
      example: 14130-kawasaki-shi
    ProjectMunicipalityCode:
      name: municipality_code
      in: query
      required: false
      description: 全国地方公共団体コード（5桁、検査数字つきの6桁も可）。
      schema:
        type: string
        pattern: "^\\d{5,6}$"
    ProjectEvaluationYear:
      name: evaluation_year
      in: query
      required: false
      description: 評価した年度（西暦）。シートの評価年度、無ければ掲載文書の年度。
      schema:
        type: integer
        minimum: 1000
        maximum: 9999
    ProjectDepartment:
      name: department
      in: query
      required: false
      description: 担当部署の名前の一部。
      schema:
        type: string
        maxLength: 100
    ProjectPolicy:
      name: policy
      in: query
      required: false
      description: 体系の道筋（政策・施策など、上の段から下の段まで）のどこかの名前か番号の一部。体系の分かる自治体の事業だけが当たります。
      schema:
        type: string
        maxLength: 100
      example: 5-2-1
    ProjectDirection:
      name: direction
      in: query
      required: false
      description: 今後の方向性の区分（カンマ区切りで複数）。other は文の記載で区分のないもの。
      schema:
        type: string
      example: reduce,abolish
    ProjectRating:
      name: rating
      in: query
      required: false
      description: 評価区分の原典の記載（カンマ区切り）。尺度は自治体ごとに違います。
      schema:
        type: string
    ProjectAspect:
      name: aspect
      in: query
      required: false
      description: 観点ごとの評価「観点:記号」（カンマ区切り）。例は 成果:c。
      schema:
        type: string
    ProjectAchievement:
      name: achievement
      in: query
      required: false
      description: 自治体をまたいでそろえた達成度（カンマ区切りで複数）。above 目標を上回る、on_target ほぼ目標どおり、below 目標を下回る。原典の凡例から機械で決めた大まかな段階です。
      schema:
        type: string
      example: below
    ProjectOverall:
      name: overall
      in: query
      required: false
      description: 自治体をまたいでそろえた総合評価（カンマ区切りで複数）。high 高い、middle 中くらい、low 低い。尺度の段の数で上・中・下に分けた大まかな段階です。
      schema:
        type: string
      example: low
    ProjectMethod:
      name: method
      in: query
      required: false
      description: 記録の作り方。program 様式ごとの読み取りプログラム、ai AIの書き写し、machine 様式の定義での機械抽出。
      schema:
        type: string
        enum: [program, ai, machine]
    ProjectFlag:
      name: flag
      in: query
      required: false
      description: 分析の印（カンマ区切り、すべてを持つ事業）。outcome_below_half 成果指標が目標の半分以下、expand_below_target 目標割れなのに拡充、cost_up_below_target 目標割れなのに費用が前年度の1.1倍以上、no_outcome_target 目標の数のある成果指標が無い、repeated_text 評価の文が前年度とほぼ同じ、renamed 事業名が年度で違う、not_in_latest 最新の評価年度に無い、below_target_every_year 比の出る年度が2つ以上ある成果指標がどの年度も目標割れ、actual_halved 活動・成果指標の実績が最初の年度の半分未満に減った、blank_sheet 費用のあるシートなのに目的・内容・実績・評価の文も指標も無い。原典の値から機械で付けた印で、問題があると決めたものではありません。
      schema:
        type: string
      example: outcome_below_half,cost_up_below_target
    ProjectHasAmounts:
      name: has_amounts
      in: query
      required: false
      description: 1 なら金額の表がある事業だけ。
      schema:
        type: boolean
    ProjectIsMain:
      name: is_main
      in: query
      required: false
      description: 1 なら体系図で主な事業（○など）の印がある事業だけ。
      schema:
        type: boolean
    ProjectMinCost:
      name: min_cost
      in: query
      required: false
      description: 評価した年度の費用（総費用、無ければ事業費）の下限。円。
      schema:
        type: integer
        minimum: 0
    ProjectMaxCost:
      name: max_cost
      in: query
      required: false
      description: 評価した年度の費用の上限。円。
      schema:
        type: integer
        minimum: 0
    ProjectBelowTarget:
      name: below_target
      in: query
      required: false
      description: 1 なら成果指標のどれかが目標に届いていない（実績 ÷ 目標 < 1）事業だけ。少ない方が良い指標もあります。
      schema:
        type: boolean
    ProjectMaxOutcomeRatio:
      name: max_outcome_ratio
      in: query
      required: false
      description: 成果指標の実績 ÷ 目標の最小値の上限。
      schema:
        type: number
        minimum: 0
    ProjectMinCostChangeRatio:
      name: min_cost_change_ratio
      in: query
      required: false
      description: 前の年度からの費用の比（今年 ÷ 前年）の下限。
      schema:
        type: number
        minimum: 0
    ProjectMaxOutcomeBestRatio:
      name: max_outcome_best_ratio
      in: query
      required: false
      description: "何年も目標に届かない事業を探す。成果指標ごとに、評価した年度までの年度の比（実績 ÷ 目標）のうち最良の値をとり、その最小がこの値以下の事業。比の出る年度が2つ以上の指標だけを見ます。例: 0.6 でどの年度も目標の6割に届かない成果指標がある事業。"
      schema:
        type: number
        minimum: 0
    ProjectMaxActualChangeRatio:
      name: max_actual_change_ratio
      in: query
      required: false
      description: "活動・成果指標の実績が減った事業を探す。実績が正の最も古い年度から評価の年度までの実績の比（後 ÷ 前）の最小の上限。例: 0.5 で半分以下に減った指標がある事業。少ない方が良い指標もあります。"
      schema:
        type: number
        minimum: 0
    ProjectMinPersonnelRatio:
      name: min_personnel_ratio
      in: query
      required: false
      description: 評価した年度の費用に占める人件費の割合の下限（0〜1）。人件費は自治体の見積もり（人工 × 単価）のことが多いです。
      schema:
        type: number
        minimum: 0
        maximum: 1
    ProjectMinCostPerPerson:
      name: min_cost_per_person
      in: query
      required: false
      description: 参加者・利用者・受講者など人を数える指標での1人あたりの費用の下限（円）。費用 ÷ その種の指標の実績のうち最も多いもの。費用は事業全体なので、指標が事業の一部しか表さない場合は大きく出ます。
      schema:
        type: integer
        minimum: 0
  schemas:
    HyokaProject:
      type: object
      properties:
        id:
          type: string
          description: 事業のID（hyoka-project:<slug>:<doc_id>:<record_id>）。
        project_name:
          type: string
        department:
          type: string
        municipality_name:
          type: string
        pref_name:
          type: string
        evaluation_year:
          type: [integer, "null"]
        cost_yen:
          type: [integer, "null"]
          description: 評価した年度の費用（円）。総費用、無ければ事業費（cost_scope）。原典の値は cost_raw と cost_unit。
        cost_year:
          type: [integer, "null"]
        cost_stage:
          type: string
          description: settlement 決算、estimate 決算見込、revised_budget 補正後予算、budget 予算、initial_budget 当初予算、plan 計画。
        cost_scope:
          type: string
        cost_raw:
          type: string
        cost_unit:
          type: string
        cost_prev_yen:
          type: [integer, "null"]
          description: 前の年度の同じ事業・費目の金額（集計に使う値）。
        cost_change_ratio:
          type: [number, "null"]
          description: 今年 ÷ 前年。
        staff_fte:
          type: [number, "null"]
          description: 人工（職員の数の換算）。
        personnel_yen:
          type: [integer, "null"]
          description: 評価した年度の費用と同じ年度・段階の人件費（円）。
        personnel_ratio:
          type: [number, "null"]
          description: 費用に占める人件費の割合（0〜1）。
        rating:
          type: string
        direction:
          type: string
        direction_text:
          type: string
        aspects:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
              unit:
                type: string
              year:
                type: integer
              target:
                type: string
              actual:
                type: string
              ratio:
                type: [number, "null"]
              cost_per_unit_yen:
                type: [integer, "null"]
                description: 費用 ÷ 実績（1単位あたりの費用、円）。割合・点数・金額の指標では出しません。
              ratio_years:
                type: integer
                description: 目標と実績の両方がある年度の数（評価した年度まで）。
              best_ratio:
                type: [number, "null"]
                description: 年度ごとの比のうち最良の値（比の出る年度が2つ以上のとき）。
              first_year:
                type: [integer, "null"]
                description: 実績が正の最も古い年度。
              first_actual:
                type: [string, "null"]
                description: その年度の実績（原典の記載）。
              change_ratio:
                type: [number, "null"]
                description: year の実績 ÷ first_year の実績。
        outcome_ratio_min:
          type: [number, "null"]
        outcome_best_ratio_min:
          type: [number, "null"]
          description: 成果指標ごとの年度の比のうち最良の値の、指標のうち最小のもの。1 未満なら、どの年度も目標に届かない成果指標があります。
        actual_change_min:
          type: [number, "null"]
          description: 活動・成果指標の実績の、最初の年度から評価の年度までの比の最小。
        cost_per_person_yen:
          type: [integer, "null"]
          description: 参加者・利用者など人を数える指標での1人あたりの費用（円）。
        flags:
          type: array
          items:
            type: string
          description: 分析の印。原典の値から機械で付けたもので、問題があると決めたものではありません。
        project_names:
          type: array
          items:
            type: string
          description: 同じ事業の名前の並び（年度の古い順）。
        project_first_year:
          type: [integer, "null"]
        project_last_year:
          type: [integer, "null"]
        text_repeat_ratio:
          type: [number, "null"]
          description: 評価の文のうち、前の年度の同じ事業と同じ文の割合。
        policy_names:
          type: array
          items:
            type: string
          description: 体系の道筋の段の番号と名前（上の段から）。段の呼び名は自治体ごとに違います。
        policy_top:
          type: [string, "null"]
        policy_leaf:
          type: [string, "null"]
        level:
          type: [string, "null"]
          description: 事業の階層の原典の呼び名（事務事業、細事業など）。
        variant_base:
          type: [string, "null"]
          description: 区や対象で分けた事業の、もとの事業名。
        variant_label:
          type: [string, "null"]
        is_main:
          type: [boolean, "null"]
          description: 体系図で主な事業の印があるか。
        achievement:
          type: [string, "null"]
          description: そろえた達成度（above・on_target・below）。
        overall:
          type: [string, "null"]
          description: そろえた総合評価（high・middle・low）。
        method:
          type: string
        location:
          type: string
        source_url:
          type: string
        source_page_link:
          type: string
        document_id:
          type: string
          description: /api/document に渡せる文書のID。
        detail_url:
          type: string
        api_project_url:
          type: string
    HyokaProjectsResponse:
      type: object
      properties:
        status:
          type: string
        query:
          type: string
        sort:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_relation:
          type: string
        has_more:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/HyokaProject"
    HyokaAggregateResponse:
      type: object
      properties:
        status:
          type: string
        year:
          type: [integer, "null"]
        scope:
          type: string
        stage:
          type: string
        group_by:
          type: string
        matched_records:
          type: integer
        total:
          type: object
          properties:
            yen:
              type: integer
            projects:
              type: integer
            municipalities:
              type: integer
        groups:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              yen:
                type: integer
              projects:
                type: integer
        other_groups_yen:
          type: integer
        top_projects:
          type: array
          items:
            type: object
        notes:
          type: array
          items:
            type: string
    HyokaProjectResponse:
      type: object
      properties:
        status:
          type: string
        project:
          $ref: "#/components/schemas/HyokaProject"
        record:
          type: [object, "null"]
          description: 原典の欄と表（金額の表は原典の単位のまま）、指標、評価の段階、検算。
        sheet:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              text:
                type: string
        sheet_truncated:
          type: boolean
    SearchResponse:
      type: object
      required: [status, query, doc_type, page, per_page, total, items]
      properties:
        status:
          type: string
          example: ok
        error:
          type: string
          example: ""
        query:
          type: string
        doc_type:
          type: string
          enum: [minutes, reiki, hyoka]
        index_alias:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_relation:
          type: string
          enum: [eq, gte]
        has_more:
          type: boolean
        took_ms:
          type: integer
        proximity_ranked:
          type: boolean
          description: 近接優先が働いたか。true のとき、検索語が近くに現れた文書がまとまって先頭に並び、その中と外がそれぞれ日付順になる。
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"
        aggregations:
          $ref: "#/components/schemas/Aggregations"
          description: 文書種別・都道府県・自治体ごとの件数。include_facets が true のときだけ中身が入り、それ以外は空の配列です。
    DocumentResponse:
      type: object
      required: [status, document]
      properties:
        status:
          type: string
          example: ok
        document:
          $ref: "#/components/schemas/Document"
    Document:
      allOf:
        - $ref: "#/components/schemas/SearchItem"
        - type: object
          properties:
            body:
              type: string
              description: 文書本文の全文テキストです。hyoka は該当頁の本文（頁区切りが不明なら文書全体）です。
            indexed_at:
              type: string
            speaker:
              type: string
            speaker_role:
              type: string
    SearchItem:
      type: object
      properties:
        id:
          type: string
        score:
          type:
            - number
            - "null"
          description: 検索スコア。関連度順（sort=relevance）のときだけ入り、並び順に対応します。日付順と /api/document では null です。
        proximity:
          type:
            - boolean
            - "null"
          description: 検索語が本文中で近く（おおむね同じ文の中）に現れたか。日付順の AND 検索でだけ入り、それ以外は null。
        doc_type:
          type: string
          enum: [minutes, reiki, hyoka]
        slug:
          type: string
        municipality_code:
          type: string
        pref_code:
          type: string
        pref_name:
          type: string
        municipality_name:
          type: string
        title:
          type: string
        title_highlight:
          type: string
        excerpt:
          type: string
          description: 該当箇所の抜粋。検索語は [[[ と ]]] で囲まれます。
        body_length:
          type: integer
        source_url:
          type: string
          format: uri
        detail_url:
          type: string
          description: サイト内のページの相対URLです。会議録・事務事業評価は詳細ページ、例規集はサイト内の例規の表示ページです。原サイトのURLは source_url です。
        api_document_url:
          type: string
          description: この文書の全文をJSONで取得するAPI URLです。
        source_system:
          type: string
        sort_date:
          type: string
        held_on:
          type: string
        promulgated_on:
          type: string
        assembly_name:
          type: string
        meeting_name:
          type: string
        year_label:
          type: string
        category:
          type: string
        fiscal_year:
          type: [integer, "null"]
          description: hyoka の年度（西暦）。不明なら null。
        kind:
          type: string
          enum: [project_evaluation, policy_evaluation, external_review, overview]
          description: hyoka の種別。
        link_text:
          type: string
          description: hyoka の原典リンクの文字。
        heading:
          type: string
          description: hyoka の原典リンクの周囲の見出し。
        source_page_url:
          type: string
          description: hyoka の原典を見つけた掲載ページのURL。
        page:
          type: [integer, "null"]
          description: hyoka の原典の頁番号（1から）。頁区切りが不明なら null で文書全体。検索結果のページ番号とは別。事業のシートが何頁にもわたるときは最初の頁。
        page_end:
          type: [integer, "null"]
          description: hyoka の原典の頁の範囲の最後。事業のシートが何頁にもわたるとき page より大きい。
        segment:
          type: string
          description: hyoka の 1 件の分類。sheet 事業 1 件のシート（関連度で優先）、table 1 頁に何事業も載る一覧、other 事業の無い頁、page 事業の記録の無い文書の頁、document 頁に分けられない文書。
        source_page_link:
          type: string
          description: hyoka の原典の該当頁へのURL。頁不明なら原典URL。
        sha256:
          type: string
          description: hyoka の取得した原典のSHA-256。
        fetched_at:
          type: string
          description: hyoka の原典の取得日時。
        status:
          type: string
          description: hyoka の取得元の状態。gone は取得元から消えた保存済み文書。
        text_status:
          type: string
          description: hyoka の本文抽出の状態。第1段の索引対象は ok のみ。
        page_split_reason:
          type: string
          description: hyoka の頁分割の根拠または分割できない理由。saved_text_no_page_boundaries は保存済み本文に頁区切りが無い。
        records:
          type: array
          description: hyoka で、事業ごとの欄に分けてある文書の事業（/api/search のみ）。検索語を含むものを先に最大5件。値は原典の表の欄を、自治体ごとの様式の定義で機械が、または AI が書き写したもの（各件の method。AI の値は原典の文字と機械で照合済み）で、人の確認はまだです。分けていない文書は空の配列です。
          items:
            $ref: "#/components/schemas/HyokaRecord"
        records_total:
          type: integer
          description: hyoka でこの頁（頁区切りが無ければ文書全体）の事業の数。分けていない文書は 0 です。
    HyokaRecord:
      type: object
      description: 事務事業評価の事業 1 件の短い形。
      properties:
        id:
          type: string
          description: 事業の記録のID。
        project_name:
          type: string
          description: 事業名。
        department:
          type: string
          description: 担当部署。
        year:
          type: string
          description: 対象年度・評価年度の記載。
        evaluation_rating:
          type: string
          description: 評価区分の記載。
        future_direction:
          type: string
          description: 今後の方向性の記載。
        location:
          type: string
          description: 原典の頁など。
        method:
          type: string
          enum: [machine, ai]
          description: 書き写し方。machine は自治体ごとの様式の定義で機械が取り出した記録、ai は AI が書き写し原典の文字と機械で照合した記録。
        matched:
          type: boolean
          description: 検索語を含む事業か。
    Aggregations:
      type: object
      properties:
        doc_types:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
        prefectures:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
        municipalities:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
    Bucket:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        error:
          type: string
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        total_relation:
          type: string
