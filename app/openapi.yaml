openapi: 3.1.0
info:
  title: 自治体マップ 検索API
  version: 1.0.0
  description: 全国自治体の会議録・例規集・事務事業評価を検索する公開APIです。既定では会議録を検索します。AIアシスタント連携にはMCPエンドポイント https://tools.miya.be/mcp を推奨します。このREST APIは互換のため維持されます。
servers:
  - url: https://tools.miya.be
    description: Production
paths:
  /api/search:
    get:
      operationId: searchMunicipalDocuments
      summary: 会議録・例規集・事務事業評価を検索する
      description: 検索語、文書種別、都道府県、自治体で絞り込み、抜粋と原典URLを返します。hyoka は年度・種別、それ以外は日付範囲で絞れます。hyoka の1件は頁単位（頁区切りが不明なら文書全体）です。
      parameters:
        - name: q
          in: query
          required: true
          description: 検索語。空白区切りはAND検索、引用符で完全一致、OR/NOT/括弧も利用できます。
          schema:
            type: string
            minLength: 1
          example: 盛土 メガソーラー
        - name: doc_type
          in: query
          required: false
          description: 検索対象。minutes は会議録、reiki は例規集、hyoka は事務事業評価。省略時は会議録です。
          schema:
            type: string
            enum: [minutes, reiki, hyoka]
            default: minutes
        - name: pref_code
          in: query
          required: false
          description: 都道府県コード。神奈川県は14です。
          schema:
            type: string
            pattern: "^\\d{1,2}$"
          example: "14"
        - name: slug
          in: query
          required: false
          description: 自治体を1つに絞るID。検索結果や検索画面のURLに含まれます。
          schema:
            type: string
          example: 14216-zama-shi
        - name: municipality_code
          in: query
          required: false
          description: 全国地方公共団体コードで絞り込みます。
          schema:
            type: string
          example: "142166"
        - name: start_date
          in: query
          required: false
          description: 検索対象期間の開始日。YYYY-MM-DD形式です。hyoka には適用されません。
          schema:
            type: string
            format: date
          example: "2020-01-01"
        - name: end_date
          in: query
          required: false
          description: 検索対象期間の終了日。YYYY-MM-DD形式です。hyoka には適用されません。
          schema:
            type: string
            format: date
          example: "2024-12-31"
        - name: start_year
          in: query
          required: false
          description: 検索対象期間の開始年。start_date が未指定の場合に使われます。hyoka には適用されません。
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 2020
        - name: end_year
          in: query
          required: false
          description: 検索対象期間の終了年。end_date が未指定の場合に使われます。hyoka には適用されません。
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 2024
        - name: fiscal_year
          in: query
          required: false
          description: hyoka の年度を西暦4桁で完全一致指定します。minutes/reiki では使いません。
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2024
        - name: kind
          in: query
          required: false
          description: hyoka の種別。事務事業評価、施策・政策評価、外部評価、概要・一覧。minutes/reiki では使いません。
          schema:
            type: string
            enum: [project_evaluation, policy_evaluation, external_review, overview]
        - name: sort
          in: query
          required: false
          description: 並び順。dateは新しい順（hyoka は年度順）、relevanceは関連度順です。
          schema:
            type: string
            enum: [date, relevance]
            default: date
        - name: page
          in: query
          required: false
          description: ページ番号。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: 1ページあたりの件数。最大100件です。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: include_facets
          in: query
          required: false
          description: trueの場合、文書種別・都道府県・自治体ごとの件数（aggregations）も返します。
          schema:
            type: boolean
            default: false
        - name: include_body_highlight
          in: query
          required: false
          description: falseの場合、本文中の該当箇所を探しません。excerpt には件名・会議名に当たった箇所だけが入り、無ければ空です。応答は速くなります。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: 検索語が未指定、または検索条件が不正です。hyoka の fiscal_year / kind の不正値も含みます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 検索処理に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/document:
    get:
      operationId: getMunicipalDocument
      summary: 文書の全文を取得する
      description: 検索結果のidとdoc_typeを指定して本文を返します。hyoka は該当頁の本文（頁区切りが不明なら文書全体）と原典URL・頁を返します。
      parameters:
        - name: id
          in: query
          required: true
          description: /api/search の items[].id で返る文書IDです。
          schema:
            type: string
            minLength: 1
        - name: doc_type
          in: query
          required: false
          description: 文書種別。minutes は会議録、reiki は例規集、hyoka は事務事業評価。省略時は会議録です。
          schema:
            type: string
            enum: [minutes, reiki, hyoka]
            default: minutes
      responses:
        "200":
          description: 文書全文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: 文書が見つかりません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 文書IDが未指定です。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 文書取得に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 検索基盤が利用できません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    SearchResponse:
      type: object
      required: [status, query, doc_type, page, per_page, total, items]
      properties:
        status:
          type: string
          example: ok
        error:
          type: string
          example: ""
        query:
          type: string
        doc_type:
          type: string
          enum: [minutes, reiki, hyoka]
        index_alias:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_relation:
          type: string
          enum: [eq, gte]
        has_more:
          type: boolean
        took_ms:
          type: integer
        proximity_ranked:
          type: boolean
          description: 近接優先が働いたか。true のとき、検索語が近くに現れた文書がまとまって先頭に並び、その中と外がそれぞれ日付順になる。
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"
        aggregations:
          $ref: "#/components/schemas/Aggregations"
    DocumentResponse:
      type: object
      required: [status, document]
      properties:
        status:
          type: string
          example: ok
        document:
          $ref: "#/components/schemas/Document"
    Document:
      allOf:
        - $ref: "#/components/schemas/SearchItem"
        - type: object
          properties:
            body:
              type: string
              description: 文書本文の全文テキストです。hyoka は該当頁の本文（頁区切りが不明なら文書全体）です。
            indexed_at:
              type: string
            speaker:
              type: string
            speaker_role:
              type: string
    SearchItem:
      type: object
      properties:
        id:
          type: string
        score:
          type:
            - number
            - "null"
          description: 検索スコア。関連度順のときの並び順に対応する。日付順のときは null。
        proximity:
          type:
            - boolean
            - "null"
          description: 検索語が本文中で近く（おおむね同じ文の中）に現れたか。日付順の AND 検索でだけ入り、それ以外は null。
        doc_type:
          type: string
          enum: [minutes, reiki, hyoka]
        slug:
          type: string
        municipality_code:
          type: string
        pref_code:
          type: string
        pref_name:
          type: string
        municipality_name:
          type: string
        title:
          type: string
        title_highlight:
          type: string
        excerpt:
          type: string
          description: 該当箇所の抜粋。検索語は [[[ と ]]] で囲まれます。
        body_length:
          type: integer
        source_url:
          type: string
          format: uri
        detail_url:
          type: string
          description: 会議録・事務事業評価ではサイト内の詳細ページURL、例規集では原サイト等のURLです。
        api_document_url:
          type: string
          description: この文書の全文をJSONで取得するAPI URLです。
        source_system:
          type: string
        sort_date:
          type: string
        held_on:
          type: string
        promulgated_on:
          type: string
        assembly_name:
          type: string
        meeting_name:
          type: string
        year_label:
          type: string
        category:
          type: string
        fiscal_year:
          type: [integer, "null"]
          description: hyoka の年度（西暦）。不明なら null。
        kind:
          type: string
          enum: [project_evaluation, policy_evaluation, external_review, overview]
          description: hyoka の種別。
        link_text:
          type: string
          description: hyoka の原典リンクの文字。
        heading:
          type: string
          description: hyoka の原典リンクの周囲の見出し。
        source_page_url:
          type: string
          description: hyoka の原典を見つけた掲載ページのURL。
        page:
          type: [integer, "null"]
          description: hyoka の原典の頁番号（1から）。頁区切りが不明なら null で文書全体。検索結果のページ番号とは別。
        source_page_link:
          type: string
          description: hyoka の原典の該当頁へのURL。頁不明なら原典URL。
        sha256:
          type: string
          description: hyoka の取得した原典のSHA-256。
        fetched_at:
          type: string
          description: hyoka の原典の取得日時。
        status:
          type: string
          description: hyoka の取得元の状態。gone は取得元から消えた保存済み文書。
        text_status:
          type: string
          description: hyoka の本文抽出の状態。第1段の索引対象は ok のみ。
        page_split_reason:
          type: string
          description: hyoka の頁分割の根拠または分割できない理由。saved_text_no_page_boundaries は保存済み本文に頁区切りが無い。
    Aggregations:
      type: object
      properties:
        doc_types:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
        prefectures:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
        municipalities:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
    Bucket:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        error:
          type: string
        detail:
          type: string
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        total_relation:
          type: string
