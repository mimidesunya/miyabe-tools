[www]
; 既定の pm.max_children=5 では、横断検索やトップ API が重なっただけで詰まりやすい。
; このアプリは短い PHP リクエストが多いので、worker を少し厚めにして待ち行列を減らす。
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
catch_workers_output = yes
request_terminate_timeout = 120s
; トップ API のキャッシュを作り直すとき、全自治体分の payload を一度に
; 組み立てる。PHP 既定の 128M では途中で Fatal error になり、ページが
; 真っ白になるため広げておく。
php_admin_value[memory_limit] = 1024M
; この値はもともとYouTubeアップローダのチャンク受信のために広げたもの。
; アップローダは削除したが、post_max_size はファイル送信に限らず
; すべてのPOST本文に効くため、既定（8M）まで下げると別の機能が
; 黙って壊れる恐れがある。上限として置いたままにする。
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M
