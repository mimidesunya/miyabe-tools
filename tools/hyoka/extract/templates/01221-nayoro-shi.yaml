version: 1
municipality:
  code: '01221'
  name: 北海道 名寄市
notes: 試料の様式を定義。未対応頁・読めない欄は失敗一覧に残す。
templates:
- id: nayoro-administrative-sheet
  layout: single_project_sheet
  match:
  - pattern: 行政評価調書
  - pattern: 担当課室
  - pattern: 作成責任者
  fields:
    project_name:
      label:
        rect: &id001
        - 0.08
        - 0.1
        - 0.216
        - 0.15
        pattern: ^事業名
      value:
        same_row: ^事業名
        columns:
        - anchor_right
        - 0.578
        top_offset: -0.005
        bottom_offset: 0.005
        rect: *id001
    department:
      label:
        rect: &id002
        - 0.48
        - 0.13
        - 0.58
        - 0.18
        pattern: 担当課室
      value:
        same_row: 担当課室
        columns:
        - 0.581
        - 0.76
        top_offset: -0.005
        bottom_offset: 0.005
        rect: *id002
    evaluation_year:
      label:
        rect:
        - 0.3
        - 0.075
        - 0.7
        - 0.13
        pattern: 行政評価調書
      value:
        rect:
        - 0.3
        - 0.075
        - 0.7
        - 0.13
        pattern: (令和[0-9]+年度)
    target_year:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    future_direction:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    evaluation_actor:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
  pages: 2
  continuation_match:
  - page: 1
    pattern: 1次評価.*ワーキンググループ評価.*外部評価.*2次評価
  instances:
  - id: primary
    fields:
      evaluation_actor:
        label:
          rect: &id003
          - 0.08
          - 0.25
          - 0.95
          - 0.93
          pattern: 1次評価
          page: 1
        value:
          rect: *id003
          pattern: 1次評価
          page: 1
      future_direction:
        label:
          rect:
          - 0.21
          - 0.3
          - 0.31
          - 0.8
          pattern: 予算規模
          page: 1
        value:
          anchor: 予算規模
          anchor_index: 0
          relative_rect:
          - -0.014
          - 0.012
          - 0.069
          - 0.037
          rect:
          - 0.21
          - 0.3
          - 0.31
          - 0.8
          page: 1
    raw_fields:
    - label:
        rect: *id003
        pattern: 1次評価
        page: 1
      value:
        between_headings:
        - ^1次評価
        - ^ワーキンググループ評価
        columns:
        - 0.09
        - 0.91
        rect: *id003
        page: 1
  - id: working
    fields:
      evaluation_actor:
        label:
          rect: &id004
          - 0.08
          - 0.25
          - 0.95
          - 0.93
          pattern: ワーキンググループ評価
          page: 1
        value:
          rect: *id004
          pattern: ワーキンググループ評価
          page: 1
      future_direction:
        label:
          rect:
          - 0.21
          - 0.3
          - 0.31
          - 0.8
          pattern: 予算規模
          page: 1
        value:
          anchor: 予算規模
          anchor_index: 1
          relative_rect:
          - -0.014
          - 0.012
          - 0.069
          - 0.037
          rect:
          - 0.21
          - 0.3
          - 0.31
          - 0.8
          page: 1
    raw_fields:
    - label:
        rect: *id004
        pattern: ワーキンググループ評価
        page: 1
      value:
        between_headings:
        - ^ワーキンググループ評価
        - ^外部評価
        columns:
        - 0.09
        - 0.91
        rect: *id004
        page: 1
  - id: external
    fields:
      evaluation_actor:
        label:
          rect: &id005
          - 0.08
          - 0.25
          - 0.95
          - 0.93
          pattern: 外部評価
          page: 1
        value:
          rect: *id005
          pattern: 外部評価
          page: 1
      future_direction:
        absent: 専用の予算規模欄・方向性欄はない。提言・意見の文中から判断しない。
    raw_fields:
    - label:
        rect: *id005
        pattern: 外部評価
        page: 1
      value:
        between_headings:
        - ^外部評価
        - ^2次評価
        columns:
        - 0.09
        - 0.91
        rect: *id005
        page: 1
      embedded_fields:
      - future_direction
  - id: secondary
    fields:
      evaluation_actor:
        label:
          rect: &id006
          - 0.08
          - 0.25
          - 0.95
          - 0.93
          pattern: 2次評価
          page: 1
        value:
          rect: *id006
          pattern: 2次評価
          page: 1
      future_direction:
        absent: 専用の予算規模欄・方向性欄はない。提言・意見の文中から判断しない。
    raw_fields:
    - label:
        rect: *id006
        pattern: 2次評価
        page: 1
      value:
        between_headings:
        - ^2次評価
        - '^注:'
        columns:
        - 0.09
        - 0.91
        rect: *id006
        page: 1
      embedded_fields:
      - future_direction
  raw_fields: []
