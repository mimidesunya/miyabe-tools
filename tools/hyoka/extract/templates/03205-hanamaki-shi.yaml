version: 1
municipality:
  code: '03205'
  name: 岩手県 花巻市
notes: 事後評価の評価表と事業説明資料を別記録として転記。同名でも別文書の部署を移植しない。表題の年度は今年度の実績対象年、作業年度ではない。評価主体を事後評価という段階名から補完しない。
templates:
- id: hanamaki-post
  layout: single_project_sheet
  match:
  - pattern: 事務事業評価シート
  - pattern: 次年度に向けて
  fields:
    project_name:
      label:
        rect:
        - 0.2
        - 0.1
        - 0.5
        - 0.13
        pattern: 事業名
      value:
        rect:
        - 0.216
        - 0.129
        - 0.494
        - 0.151
    department:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    evaluation_year:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    target_year:
      label:
        rect: &id001
        - 0
        - 0.04
        - 0.25
        - 0.14
        pattern: 事務事業評価シート
      value:
        rect: *id001
        pattern: (令和[0-9]+年度)
    future_direction:
      label:
        rect: &id002
        - 0.52
        - 0.6
        - 0.543
        - 0.91
        pattern: 次年度に向けて
      value:
        same_row: 次
        columns:
        - 0.544
        - 0.992
        max_height: 0.3
        rect: *id002
        row_span:
        - 0.55
        - 0.98
    evaluation_actor:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    purpose:
      label:
        rect: &id003
        - 0
        - 0.18
        - 0.04
        - 0.26
        pattern: 目的
      value:
        same_row: 目的
        columns:
        - 0.042
        - 0.494
        rect: *id003
        row_span:
        - 0.05
        - 0.48
  raw_fields:
  - label:
      rect: &id004
      - 0.52
      - 0.5
      - 0.543
      - 0.8
      pattern: 今年度の振り返り
    value:
      same_row: 今
      columns:
      - 0.544
      - 0.992
      max_height: 0.3
      rect: *id004
      row_span:
      - 0.55
      - 0.98
