version: 1
municipality:
  code: 09364
  name: 栃木県 野木町
notes: 試料の様式を定義。未対応頁・読めない欄は失敗一覧に残す。
templates:
- id: nogi-management-sheet
  layout: single_project_sheet
  match:
  - pattern: 野木町総合計画進行管理
  - pattern: 事務事業評価シート
  - pattern: 今後の方向性
  fields:
    project_name:
      label:
        rect: &id001
        - 0.08
        - 0.1
        - 0.303
        - 0.16
        pattern: \(1\)事務事業
      value:
        same_row: \(1\)事務事業
        columns:
        - 0.305
        - 0.91
        rect: *id001
        row_span:
        - 0.31
        - 0.9
    department:
      label:
        rect: &id002
        - 0.5
        - 0.08
        - 0.91
        - 0.115
        pattern: '作成:'
      value:
        same_row: '作成:'
        columns:
        - anchor_right
        - 0.91
        rect: *id002
    evaluation_year:
      label:
        rect:
        - 0.15
        - 0.055
        - 0.9
        - 0.09
        pattern: 事務事業評価シート
      value:
        rect:
        - 0.15
        - 0.055
        - 0.9
        - 0.09
        pattern: (令和[0-9]+年度)
    target_year:
      label:
        rect:
        - 0.15
        - 0.055
        - 0.9
        - 0.09
        pattern: 事務事業評価シート
      value:
        rect:
        - 0.15
        - 0.055
        - 0.9
        - 0.09
        pattern: シート\((令和[0-9]+年度)実績分\)
    future_direction:
      label:
        rect: &id003
        - 0.3
        - 0.7
        - 0.5
        - 0.95
        pattern: 今後の方向性
      value:
        same_row: 今後の方向性
        columns:
        - 0.495
        - 0.91
        rect: *id003
        row_span:
        - 0.5
        - 0.9
    evaluation_actor:
      absent: この様式に専用の欄がない。本文や別年度から補完しない。
    purpose:
      label:
        rect: &id004
        - 0.08
        - 0.13
        - 0.303
        - 0.3
        pattern: \(3\)事務事業目的
      value:
        same_row: \(3\)事務事業目的
        columns:
        - 0.305
        - 0.91
        rect: *id004
        row_span:
        - 0.31
        - 0.9
  raw_fields:
  - label:
      rect: &id005
      - 0.08
      - 0.13
      - 0.303
      - 0.3
      pattern: \(2\)根拠\(法令、計画\)
    value:
      same_row: \(2\)根拠\(法令、計画\)
      columns:
      - 0.305
      - 0.91
      rect: *id005
      row_span:
      - 0.31
      - 0.9
  - label:
      rect: &id006
      - 0.08
      - 0.15
      - 0.303
      - 0.35
      pattern: \(4\)事務事業内容
    value:
      same_row: \(4\)事務事業内容
      columns:
      - 0.305
      - 0.91
      rect: *id006
      row_span:
      - 0.31
      - 0.9
