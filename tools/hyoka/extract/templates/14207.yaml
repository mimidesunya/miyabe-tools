version: 1
municipality:
  code: '14207'
  name: 神奈川県 茅ヶ崎市
notes: 政策的事業の先頭頁と、表の列構造・原典先頭頁が一致する継続頁。選択印は文書結果に根拠を保存。
templates:
- id: chigasaki-policy-first-page
  layout: list_only
  match:
  - pattern: 事務事業評価
  - pattern: 政策的事業の実績
  - pattern: 課名
  - pattern: 事務事業の指標
    rect:
    - 0.554
    - 0.6
    - 0.669
    - 0.654
  fields:
    project_name:
      label:
        rect:
        - 0.042
        - 0.605
        - 0.139
        - 0.65
        pattern: 事務事業
      value:
        rect:
        - 0.043
        - row_top
        - 0.138
        - row_bottom
    department:
      label:
        rect:
        - 0.022
        - 0.181
        - 0.111
        - 0.199
        pattern: 課名
      value:
        rect:
        - 0.113
        - 0.181
        - 0.334
        - 0.199
    target_year:
      label:
        rect:
        - 0.02
        - 0.579
        - 0.7
        - 0.604
        pattern: 政策的事業の実績
      value:
        rect:
        - 0.02
        - 0.579
        - 0.7
        - 0.604
        pattern: (令和(?:元|[0-9]+)年度)
    evaluation_rating:
      label:
        rect:
        - 0.864
        - 0.607
        - 0.892
        - 0.651
        pattern: 評価
      value:
        rect:
        - 0.865
        - row_top
        - 0.891
        - row_bottom
    future_direction:
      label:
        page: first
        rect:
        - 0.892
        - 0.599
        - 0.976
        - 0.62
        pattern: Action
      value:
        choices:
        - text:
            page: first
            rect:
            - 0.919
            - 0.621
            - 0.946
            - 0.651
            pattern: 事務改善
          mark:
            rect:
            - 0.923
            - var: row_top
              offset: 0.004
            - 0.943
            - var: row_bottom
              offset: -0.004
          frame_required: false
        - text:
            page: first
            rect:
            - 0.947
            - 0.621
            - 0.976
            - 0.651
            pattern: 休・廃止
          mark:
            rect:
            - 0.951
            - var: row_top
              offset: 0.004
            - 0.972
            - var: row_bottom
              offset: -0.004
          frame_required: false
      note: Action 欄の選択印から、事務改善・休廃止の原語だけを転記。取組時間の増減を方向性へ読み替えない。
    evaluation_year:
      absent: この様式の事業欄に専用の表示がない。別欄・manifest からは補完しない。
    evaluation_actor:
      absent: この様式の事業欄に専用の表示がない。別欄・manifest からは補完しない。
  raw_fields:
  - label:
      rect:
      - 0.321
      - 0.599
      - 0.555
      - 0.62
      pattern: 事務事業の取組結果と成果
    value:
      rect:
      - 0.323
      - row_top
      - 0.555
      - row_bottom
  - label:
