version: 1
municipality:
  code: '20212'
  name: 長野県 大町市
notes: 試料の様式を定義。未対応頁・読めない欄は失敗一覧に残す。
templates:
- id: omachi-review-blocks
  layout: single_project_sheet
  match:
  - pattern: 事務事業No.
  - pattern: 事務事業名
  - pattern: 今後の方向性
  fields:
    project_name:
      label:
        rect: &id001
        - 0.3
        - var: anchor_y
          offset: -0.025
        - 0.505
        - anchor_bottom
        pattern: 事務事業名
      value:
        same_row: 事務事業名
        columns:
        - 0.506
        - 0.903
        rect: *id001
        row_span:
        - 0.52
        - 0.89
    department:
      label:
        rect: &id002
        - 0.3
        - var: anchor_y
          offset: -0.028
        - 0.505
        - var: anchor_y
          offset: -0.001
        pattern: 担当課
      value:
        same_row: 担当課
        columns:
        - 0.506
        - 0.903
        rect: *id002
        row_span:
        - 0.52
        - 0.89
    evaluation_year:
      label:
        rect:
        - 0
        - 0
        - 1
        - 1
        pattern: 行政評価
        page: first
      value:
        rect:
        - 0
        - 0
        - 1
        - 1
        pattern: (令和[0-9]+年度)行政評価
        page: first
    target_year:
      label:
        rect:
        - 0
        - 0
        - 1
        - 1
        pattern: '対象:'
        page: first
      value:
        rect:
        - 0
        - 0
        - 1
        - 1
        pattern: 対象:(令和[0-9]+年度)事業分
        page: first
    future_direction:
